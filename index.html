<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZJERO Catalogu</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}.top{background:#111;color:#fff;padding:24px 16px;text-align:center}.top h1{margin:0;font-size:30px}.top p{margin:7px 0 0}.top .address{margin-top:10px;font-size:14px;color:#ccc;line-height:1.5}.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:16px}.filters button{border:0;padding:11px 15px;border-radius:22px;background:#ddd;cursor:pointer}.filters button.active{background:#111;color:#fff}.grid{max-width:1200px;margin:auto;padding:10px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}.slider{position:relative;width:100%;aspect-ratio:4/3;background:#eee;overflow:hidden}.slider img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;display:none}.slider img.active{display:block}.slider-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.5);color:#fff;border:0;padding:8px 12px;cursor:pointer;font-size:16px;border-radius:4px;z-index:10}.slider-btn.prev{left:8px}.slider-btn.next{right:8px}.body{padding:14px}.type{font-size:12px;color:#777}.name{font-size:19px;font-weight:700;margin:5px 0}.price{font-size:18px;font-weight:700;margin:10px 0}.wa{display:block;text-align:center;text-decoration:none;background:#111;color:#fff;padding:10px;border-radius:9px}.empty{text-align:center;padding:50px}.footer{text-align:center;color:#777;padding:30px} </style></head><body><div class="top"><h1>ZJERO CATALOGU</h1><p>Katalogu Kaixao / Coffin</p><div class="address">Endereçu Loja Ami:<br>Rebal no Bairopite<br>Atende 24 oras durante loron tomak.</div></div><div class="filters"><button onclick="show('SEMUA',this)">ALL DATA</button><button onclick="show('AMERICAN S 312111';function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function show(cat,btn,save=true){if(save){localStorage.setItem('selectedCategory',cat);}document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));if(!btn){let buttons=document.querySelectorAll('.filters button');buttons.forEach(b=>{if(b.textContent.trim()===(cat==='SEMUA'?'ALL DATA':cat)){btn=b;}});if(btn)btn.classList.add('active');}else{btn.classList.add('active');}let list=cat==='SEMUA'?products:products.filter(p=>p.type===cat);document.getElementById('grid').innerHTML=list.map(p=>{let price=p.price>0?new Intl.NumberFormat('en-US',{style:'currency',currency:p.currency}).format(p.price):'Presu, kontaktu ami';let msg=encodeURIComponent('Halo ZJERO, Ha’u interese ho produtu ida-ne’e '+p.name);let imgs=p.images.map((img,i)=>`<img src="${esc(img)}" class="${i===0?'active':''}" alt="${esc(p.name)}">`).join('');return `<div class="card"><div class="slider" id="slider-${p.id}">${imgs}<button class="slider-btn prev" onclick="moveSlide('${p.id}', -1)">‹</button><button class="slider-btn next" onclick="moveSlide('${p.id}', 1)">›</button></div><div class="body"><div class="type">${esc(p.type)}</div><div class="name">${esc(p.name)}</div><div>${esc(p.desc)}</div><div class="price">${price}</div><a class="wa" href="https://wa.me/${wa}?text=${msg}" target="_blank">Husu liu husi WhatsApp</a></div></div>`}).join('')}function moveSlide(productId, direction){let slider=document.getElementById(`slider-${productId}`);let imgs=slider.querySelectorAll('img');let activeIndex=Array.from(imgs).findIndex(img=>img.classList.contains('active'));imgs[activeIndex].classList.remove('active');let newIndex=(activeIndex+direction+imgs.length)%imgs.length;imgs[newIndex].classList.add('active');}let savedCat=localStorage.getItem('selectedCategory')||'SEMUA';show(savedCat,null,false);</script></body></html>
